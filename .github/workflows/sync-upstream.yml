name: Sync upstream

# Keeps this fork current with bilawalsidhu/gods-eye-view.
#
# The target is this repository's own default branch, whatever it is called,
# so the job works without renaming or creating branches by hand.
#
# While the default branch is an untouched mirror of upstream the job fast
# forwards it directly. Once it carries commits of its own a fast forward is
# no longer possible, so the job pushes upstream/main to a dated sync branch
# and opens a pull request instead. The default branch is never overwritten.
#
# Scheduled workflows only run from the default branch, and GitHub disables
# the schedule after 60 days without repository activity. Run it by hand from
# the Actions tab whenever that happens.

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out this fork
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/bilawalsidhu/gods-eye-view.git
          git fetch --tags upstream main

      - name: Fast-forward the default branch when it is still a clean mirror
        id: ff
        run: |
          set -euo pipefail
          echo "target branch: $TARGET_BRANCH"
          git fetch origin "$TARGET_BRANCH"
          upstream_head="$(git rev-parse upstream/main)"
          fork_head="$(git rev-parse "origin/$TARGET_BRANCH")"
          if [ "$upstream_head" = "$fork_head" ]; then
            echo "$TARGET_BRANCH already matches upstream/main ($upstream_head)"
            echo "result=current" >> "$GITHUB_OUTPUT"
          elif git merge-base --is-ancestor "$fork_head" "$upstream_head"; then
            git push origin "$upstream_head:refs/heads/$TARGET_BRANCH"
            echo "fast-forwarded $TARGET_BRANCH to $upstream_head"
            echo "result=updated" >> "$GITHUB_OUTPUT"
          else
            echo "$TARGET_BRANCH has diverged from upstream, a pull request is needed"
            echo "result=diverged" >> "$GITHUB_OUTPUT"
          fi

      - name: Open a sync pull request when the default branch has diverged
        if: steps.ff.outputs.result == 'diverged'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="sync/upstream-$(date -u +%Y-%m-%d)"
          git push --force origin "upstream/main:refs/heads/$branch"
          open_pr="$(gh pr list --head "$branch" --base "$TARGET_BRANCH" --state open --json number --jq '.[0].number // ""')"
          if [ -n "$open_pr" ]; then
            echo "pull request #$open_pr already open for $branch"
            exit 0
          fi
          gh pr create \
            --base "$TARGET_BRANCH" \
            --head "$branch" \
            --title "Sync upstream main ($(date -u +%Y-%m-%d))" \
            --body "Merges the latest \`main\` from [bilawalsidhu/gods-eye-view](https://github.com/bilawalsidhu/gods-eye-view) into this fork. Opened automatically by the Sync upstream workflow."
